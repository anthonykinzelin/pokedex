AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pokedex referential service (API, Lambda functions and DynamoDB).

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  UtilsLayerArn:
    Type: String
    Description: >-
      Versioned ARN of the shared pokedex-utils layer, read from
      /pokedex/<Env>/shared/utils-layer-arn by the Makefile. No default on
      purpose: a stale fake ARN reaching CloudFormation is far worse than a
      missing-parameter error.
    AllowedPattern: '^arn:aws[a-z-]*:lambda:[a-z0-9-]+:\d{12}:layer:[a-zA-Z0-9._-]+:\d+$'

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    Layers:
      - !Ref UtilsLayerArn
    Environment:
      Variables:
        TABLE_NAME: !Ref PokedexTable

Resources:
  PurchaseEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-events'

  PurchaseEventBusNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/pokedex/${Env}/referential/event-bus-name'
      Type: String
      Value: !Ref PurchaseEventBus
      Description: Event bus used by services that consume referential events.
      Tags:
        Application: pokedex
        Environment: !Ref Env

  PokedexTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: pokedex
        - Key: Environment
          Value: !Ref Env

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: !Ref Env
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub '{{resolve:ssm:/pokedex/${Env}/auth/user-pool-arn}}'

  PokemonUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-users'
      CodeUri: functions/users/
      Handler: users.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${PokedexTable.Arn}/index/GSI1'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt PokedexTable.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/read
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write

  PokemonCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-catalog'
      CodeUri: functions/catalog/
      Handler: catalog.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${PokedexTable.Arn}/index/GSI1'
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PokedexTable.Arn
      Events:
        ListPokemons:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /pokemons
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/read
        CreatePokemon:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /pokemons
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write

  PokemonPurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-purchase'
      CodeUri: functions/purchase/
      Handler: purchase.handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref PurchaseEventBus
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PokedexTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt PurchaseEventBus.Arn
      Events:
        CreatePurchase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/{userId}/purchases
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write

Outputs:
  ApiUrl:
    Description: Base URL of the referential API.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}'
  TableName:
    Description: Name of the single-table DynamoDB table.
    Value: !Ref PokedexTable
  EventBusName:
    Description: EventBridge bus used for referential events.
    Value: !Ref PurchaseEventBus
  EventBusArn:
    Description: ARN of the EventBridge bus.
    Value: !GetAtt PurchaseEventBus.Arn
