AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pokedex referential service (API, Lambda functions and DynamoDB).

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  UtilsLayerArn:
    Type: String
    Description: >-
      Versioned ARN of the shared pokedex-utils layer, read from
      /pokedex/<Env>/shared/utils-layer-arn by the Makefile. No default on
      purpose: a stale fake ARN reaching CloudFormation is far worse than a
      missing-parameter error.
    AllowedPattern: '^arn:aws[a-z-]*:lambda:[a-z0-9-]+:\d{12}:layer:[a-zA-Z0-9._-]+:\d+$'

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    Layers:
      - !Ref UtilsLayerArn
    Environment:
      Variables:
        TABLE_NAME: !Ref PokedexTable
        # Pairs with Sourcemap: true in each function's BuildProperties, so a
        # stack trace points at the TypeScript line rather than the transpiled
        # one. sam build appends this on its own when Sourcemap is true; it is
        # spelled out here so the template shows what the runtime actually gets.
        NODE_OPTIONS: --enable-source-maps

Resources:
  PurchaseEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-events'

  PurchaseEventBusNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/pokedex/${Env}/referential/event-bus-name'
      Type: String
      Value: !Ref PurchaseEventBus
      Description: Event bus used by services that consume referential events.
      Tags:
        Application: pokedex
        Environment: !Ref Env

  PokedexTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${AWS::StackName}-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: pokedex
        - Key: Environment
          Value: !Ref Env

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: !Ref Env
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub '{{resolve:ssm:/pokedex/${Env}/auth/user-pool-arn}}'

  PokemonUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-users'
      CodeUri: functions/users/
      Handler: users.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${PokedexTable.Arn}/index/GSI1'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt PokedexTable.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/read
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write
    # esbuild transpiles users.ts into users.js at build time. Lambda's
    # handler loader only resolves .js, .mjs and .cjs, so TypeScript can never
    # be deployed as it is written. esbuild does no type checking of its own:
    # that is what `make compile` runs tsc for, before every sam build.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - users.ts
        # pokedex-utils is resolved at runtime from /opt/nodejs/node_modules.
        # Without this line esbuild inlines the whole layer into every artifact
        # and the layer stops being worth having.
        External:
          - pokedex-utils
        Target: es2023
        Format: cjs
        # Overrides esbuild's own default of true. Minified output would make
        # the stack field the logger writes to CloudWatch unreadable.
        Minify: false
        Sourcemap: true

  PokemonCatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-catalog'
      CodeUri: functions/catalog/
      Handler: catalog.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub '${PokedexTable.Arn}/index/GSI1'
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt PokedexTable.Arn
      Events:
        ListPokemons:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /pokemons
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/read
        CreatePokemon:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /pokemons
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write
    # As PokemonUsersFunction: esbuild transpiles the handler, the layer
    # stays external, and tsc does the type checking in `make compile`.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - catalog.ts
        External:
          - pokedex-utils
        Target: es2023
        Format: cjs
        Minify: false
        Sourcemap: true

  PokemonPurchaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-purchase'
      CodeUri: functions/purchase/
      Handler: purchase.handler
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref PurchaseEventBus
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PokedexTable.Arn
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt PurchaseEventBus.Arn
      Events:
        CreatePurchase:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /users/{userId}/purchases
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - pokedex/write
    # As PokemonUsersFunction: esbuild transpiles the handler, the layer
    # stays external, and tsc does the type checking in `make compile`.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - purchase.ts
        External:
          - pokedex-utils
        Target: es2023
        Format: cjs
        Minify: false
        Sourcemap: true

Outputs:
  ApiUrl:
    Description: Base URL of the referential API.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Env}'
  TableName:
    Description: Name of the single-table DynamoDB table.
    Value: !Ref PokedexTable
  EventBusName:
    Description: EventBridge bus used for referential events.
    Value: !Ref PurchaseEventBus
  EventBusArn:
    Description: ARN of the EventBridge bus.
    Value: !GetAtt PurchaseEventBus.Arn
