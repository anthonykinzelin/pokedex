AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pokedex machine-to-machine authentication service.

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-user-pool'
      UserPoolTags:
        Application: pokedex
        Environment: !Ref Env

  PokedexResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Name: Pokedex API
      Identifier: pokedex
      UserPoolId: !Ref CognitoUserPool
      Scopes:
        - ScopeName: read
          ScopeDescription: Read users and the Pokemon catalog
        - ScopeName: write
          ScopeDescription: Create purchases

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: PokedexResourceServer
    Properties:
      ClientName: !Sub '${AWS::StackName}-machine-client'
      GenerateSecret: true
      UserPoolId: !Ref CognitoUserPool
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - pokedex/read
        - pokedex/write
      EnableTokenRevocation: true

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'pokedex-${AWS::AccountId}-${Env}'
      UserPoolId: !Ref CognitoUserPool

  UserPoolArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/pokedex/${Env}/auth/user-pool-arn'
      Type: String
      Value: !GetAtt CognitoUserPool.Arn
      Description: Cognito user pool ARN consumed by the referential stack.
      Tags:
        Application: pokedex
        Environment: !Ref Env

  ResourceServerIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/pokedex/${Env}/auth/resource-server-id'
      Type: String
      Value: pokedex
      Description: OAuth resource server identifier.
      Tags:
        Application: pokedex
        Environment: !Ref Env

Outputs:
  UserPoolId:
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Value: !Ref CognitoUserPoolClient
  UserPoolArn:
    Value: !GetAtt CognitoUserPool.Arn
  AuthDomain:
    Value: !Sub 'https://pokedex-${AWS::AccountId}-${Env}.auth.${AWS::Region}.amazoncognito.com'
